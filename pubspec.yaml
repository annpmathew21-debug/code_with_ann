name: wellness_companion
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  pdf: ^3.12.0
  printing: ^5.14.3
  confetti: ^0.8.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# 🌟 ഇത് മാറ്റുക: flutter_icons എന്നതിന് പകരം flutter_launcher_icons എന്ന് തന്നെ വേണം
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/img.png"
  min_sdk_android: 21